[project]
name = "file-encoding-sniffer"
version = "0.1.0"
description = "Reads a BOM and initial bytes to guess whether a text file is UTF-8, UTF-16, or Latin-1."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
